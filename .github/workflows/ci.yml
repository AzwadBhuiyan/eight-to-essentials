# Checks every push and pull request: formatting, lint, types, tests, data validation, build and
# a dependency audit. Actions are pinned to full commit SHAs (the version is in the comment).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# No permissions by default; the job asks only for what it needs.
permissions: {}

jobs:
  check:
    name: Lint, test, validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from .nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install exact dependencies from the lockfile
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Validate framework data
        run: npm run validate-data

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate
