# Static analysis of the JavaScript and TypeScript code with GitHub CodeQL.
# Actions are pinned to full commit SHAs (the version is in the comment), so a moved tag cannot
# change what runs. Dependabot keeps the pins up to date.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1' # every Monday, to catch newly published queries

# No permissions by default; the job asks only for what it needs.
permissions: {}

jobs:
  analyze:
    name: Analyse JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the code
      security-events: write # upload the results to the Security tab
    steps:
      - name: Check out the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Run the analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:javascript-typescript'
